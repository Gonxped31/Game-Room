<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070f" />
    <title>Night Highway</title>
    <!-- Night Highway, solo: a copy of the game downloaded from Game Room. Everything is in this file; it plays offline. -->
    <!-- scripts/export-solo.mjs swaps this for the fonts, inlined. -->
    <meta
      name="inline-fonts"
      content="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap"
    />
    <style>
      /* The names next/font gives these variables on the site (app/layout.tsx); nighthighway.css builds its stacks from them. */
      :root {
        --font-big-shoulders: "Big Shoulders";
        --font-overpass: "Overpass";
        --font-overpass-mono: "Overpass Mono";
      }
      html,
      body {
        margin: 0;
        background: #04070f;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
